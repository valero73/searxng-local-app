# Local-only SearXNG settings.
# use_default_settings keeps upstream engines (Google, Bing, DDG, and 100+ others).
# Docs: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG Local"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: duckduckgo
  default_lang: auto
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: true
  method: GET

valkey:
  url: valkey://valkey:6379/0
